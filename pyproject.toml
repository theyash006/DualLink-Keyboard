[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duallink-keyboard-pc"
version = "1.0.0"
description = "Windows sender for DualLink Keyboard Bluetooth RFCOMM and ADB typing"
requires-python = ">=3.10"
dependencies = [
    "pynput>=1.7.7",
    "pyserial>=3.5",
]

[project.optional-dependencies]
bluetooth = ["pybluez>=0.23"]

[project.scripts]
duallink-keyboard = "duallink_pc.main:main"

